spring:
  application:
    name: careerlink-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/careerlink}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-production}
  expiration: ${JWT_EXPIRATION:604800000}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:""}
  api-key: ${CLOUDINARY_API_KEY:""}
  api-secret: ${CLOUDINARY_API_SECRET:""}

gemini:
  api-key: ${GEMINI_API_KEY}
  api-url: ${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}

cors:
  allowed-origins: ${FRONTEND_URL:http://localhost:5173}